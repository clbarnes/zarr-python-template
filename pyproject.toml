[project]
name = "template_cke"
version = "0.1.0"
description = "Implementation of the template extension for chunk key encoding in zarr v3"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "zarr>=3.4.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project.entry-points."zarr.chunk_key_encoding"]
"template" = "template_cke.zarr_python:TemplateChunkKeyEncoding"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pdoc>=16.0.0",
    "prek>=0.5.4",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.16.9",
    "rust-just>=1.58.0",
]
